<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <meta name="description" content="Cùng con khám phá hoạt động, thái độ của cô giáo và tình cảm của bé qua trò chơi sơ đồ tư duy.">
  <title>Cô giáo của con · Vườn nhỏ học vui</title>
  <link rel="icon" href="assets/images/flower.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=applause-1">
  <script defer src="js/game-data.js?v=tap-hints-1"></script>
  <script defer src="js/storage.js?v=tap-hints-1"></script>
  <script defer src="js/game.js?v=applause-1"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Vườn nhỏ học vui — trang trò chơi">
      <img src="assets/images/flower.svg" width="42" height="42" alt="">
      <span>vườn nhỏ</span>
    </a>
    <div class="header-actions">
      <button class="reset-button" id="reset-button" type="button" aria-label="Chơi lại từ đầu" title="Chơi lại từ đầu"><span aria-hidden="true">♡</span><span class="reset-label">Chơi lại</span></button>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="game-title">
      <h1 id="game-title"><button class="poem-title is-hint" id="poem-title-button" type="button" aria-label="Hiện câu hỏi tên bài thơ"><img src="assets/images/tap-hand.svg" width="48" height="48" alt="" aria-hidden="true"></button></h1>
      <p class="poem-author" id="poem-author" hidden><button class="is-hint" id="poem-author-button" type="button" aria-label="Hiện câu hỏi tác giả"><img src="assets/images/tap-hand.svg" width="48" height="48" alt="" aria-hidden="true"></button></p>
    </section>

    <p class="storage-notice" id="storage-notice" role="status" hidden>Trình duyệt chưa lưu được tiến độ. Bé vẫn chơi được, nhưng tiến độ có thể mất khi đóng trang.</p>

    <section class="mindmap" id="mindmap" aria-label="Sơ đồ tư duy về cô giáo">
      <svg class="connections" id="connections" aria-hidden="true"></svg>
      <div class="central-node" id="central-node">
        <div id="central-slot"></div>
      </div>
      <div id="branches" class="branches"></div>
    </section>

    <p class="play-hint" id="play-hint" hidden></p>
    <p class="sr-only" id="game-status" role="status" aria-live="polite"></p>
  </main>

  <dialog class="game-dialog selection-dialog" id="selection-dialog" aria-labelledby="selection-title" aria-describedby="selection-instruction">
    <button class="dialog-close" type="button" data-close="selection" aria-label="Đóng chọn tranh">×</button>
    <h2 id="selection-title">Chọn một bức tranh</h2>
    <p class="dialog-description" id="selection-instruction"></p>
    <div class="image-options" id="image-options"></div>
    <p class="selection-feedback" id="selection-feedback" role="status" aria-live="polite"></p>
  </dialog>

  <dialog class="game-dialog reset-dialog" id="reset-dialog" aria-labelledby="reset-title">
    <button class="dialog-close" type="button" data-close="reset" aria-label="Tiếp tục chơi">×</button>
    <div class="dialog-symbol reset-symbol" aria-hidden="true">♡</div>
    <h2 id="reset-title">Mình cùng chơi lại nhé?</h2>
    <p class="dialog-description">Bạn có muốn bắt đầu lại trò chơi không?</p>
    <div class="dialog-actions"><button class="button button-secondary" id="cancel-reset" type="button" autofocus>Tiếp tục</button><button class="button button-primary" id="confirm-reset" type="button">Chơi lại</button></div>
  </dialog>

  <dialog class="game-dialog completion-dialog" id="completion-dialog" aria-labelledby="completion-title">
    <button class="dialog-close" type="button" data-close="completion" aria-label="Đóng lời chúc mừng">×</button>
    <div class="celebration" aria-hidden="true"><span>✦</span><span>✧</span><span>★</span><span>✦</span><span>✧</span></div>
    <div class="dialog-symbol completion-symbol" aria-hidden="true">★</div>
    <h2 id="completion-title">Bé giỏi quá!</h2>
    <p class="dialog-description">Chúc mừng bé đã hoàn thành trò chơi!</p>
    <button class="button button-primary" id="view-map" type="button" autofocus>Xem sơ đồ của bé <span aria-hidden="true">→</span></button>
  </dialog>
  <noscript><p class="storage-notice">Vui lòng bật JavaScript trong trình duyệt để chơi trò chơi.</p></noscript>
</body>
</html>
